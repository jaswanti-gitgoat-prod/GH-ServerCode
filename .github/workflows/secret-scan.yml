name: Secret Scan (TruffleHog)
on: {push: {branches: [main]}, pull_request: {branches: [main]}, schedule: [{cron: '0 4 * * 1'}]}
permissions: {contents: read}
jobs: {secrets: {name: Secret Scan, runs-on: ubuntu-latest, steps: [{name: Checkout repository, uses: actions/checkout@v4, with: {fetch-depth: 0}}, {name: TruffleHog scan, uses: trufflesecurity/trufflehog@main, with: {extra_args: '--only-verified'}}]}}
