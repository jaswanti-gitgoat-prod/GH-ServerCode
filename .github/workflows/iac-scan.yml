name: IaC Scan (Checkov)
on: {push: {branches: [main]}, pull_request: {branches: [main]}, schedule: [{cron: '0 5 * * 1'}]}
permissions: {actions: read, contents: read, security-events: write}
jobs: {iac: {name: IaC Scan, runs-on: ubuntu-latest, steps: [{name: Checkout repository, uses: actions/checkout@v4}, {name: Run Checkov, uses: bridgecrewio/checkov-action@v12, with: {directory: ., quiet: true, soft_fail: true, output_format: 'cli,sarif', output_file_path: 'console,results.sarif'}}, {name: Upload SARIF, if: always(), uses: github/codeql-action/upload-sarif@v3, with: {sarif_file: results.sarif, category: checkov}}]}}
